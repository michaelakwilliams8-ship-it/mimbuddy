    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Product",
      "name": "MimBuddy",
      "brand": { "@type": "Brand", "name": "MimBuddy" },
      "category": "Assistive technology",
      "url": "https://www.mimbuddy.com.au/",
      "description": "The bedside tool for supporting neurodivergent patients, from the ED, admission, to home. A standalone hardware device with About me profiles, customised social stories, procedure information, the day's flow, visual routine boards, wait timers, calming activities, feelings and pain scale boards, staff profiles, and a mascot that speaks the patient's language and the language of their support needs."
